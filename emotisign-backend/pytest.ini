[pytest]
# Pytest configuration for WLASL-100 tests

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests

# Output options
addopts = 
    -v
    --tb=short
    --strict-markers
    --disable-warnings

# Markers
markers =
    unit: Unit tests
    integration: Integration tests
    slow: Slow tests (skipped by default)

# Coverage options (if pytest-cov is installed)
# addopts = --cov=app/ml --cov=app/services --cov-report=html --cov-report=term
