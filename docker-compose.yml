version: '3.9'

# ============================================================
# EmotiSign — Docker Compose
#
# First time setup:
#   cp .env.docker .env        # configure SECRET_KEY
#   docker compose up --build  # build and start
#
# Subsequent starts:
#   docker compose up          # start without rebuilding
#   docker compose up -d       # start in background
#
# Useful commands:
#   docker compose down        # stop containers
#   docker compose down -v     # stop + delete volumes (resets DB)
#   docker compose logs -f backend
#   docker compose logs -f frontend
# ============================================================

# Enable BuildKit for cache mounts (--mount=type=cache)
x-bake:
  group:
    default:
      targets: [backend, frontend]

services:

  # ── Backend (FastAPI) ──────────────────────────────────────
  backend:
    build:
      context: emotisign-backend
      dockerfile: Dockerfile
    container_name: emotisign-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      # Auth
      SECRET_KEY: ${SECRET_KEY:-change-me-generate-with-python-secrets}
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 60
      # Database — /app/data/ is a named volume (directory, not file)
      DATABASE_URL: sqlite+aiosqlite:////app/data/emotisign.db
      # Uploads
      UPLOAD_DIR: uploads/videos
      MAX_VIDEO_SIZE_MB: 50
      MAX_VIDEO_DURATION_SEC: 30
      # ML model (sign-to-text)
      ML_DEVICE: cpu
      USE_TTA: "true"
      CONFIDENCE_THRESHOLD: "0.25"
      MODEL_PATH: app/ml/models/wlasl100/best_model.pth
      VOCAB_PATH: app/ml/models/wlasl100/vocab.json
      TEMPERATURE_PATH: app/ml/models/wlasl100/temperature.json
      # Sign generation (text-to-sign)
      KEYPOINTS_DIR: /app/keypoints_best
      # CORS — allow the frontend container to call the backend without preflight errors.
      # In Docker Compose, the browser connects to localhost:3000 (frontend) and
      # localhost:8000 (backend) from the host machine, so both localhost origins
      # must be listed. Adjust if you expose the frontend on a different domain.
      CORS_ORIGINS: "http://localhost:3000,http://127.0.0.1:3000"
      FRONTEND_URL: "http://localhost:3000"
    volumes:
      - backend_db:/app/data
      - backend_uploads:/app/uploads
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

  # ── Frontend (Next.js) ─────────────────────────────────────
  frontend:
    build:
      context: emotisign-frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:8000}
    container_name: emotisign-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

# ── Named volumes ──────────────────────────────────────────
volumes:
  backend_db:      # SQLite database — persists across restarts
  backend_uploads: # User uploaded files — persists across restarts
